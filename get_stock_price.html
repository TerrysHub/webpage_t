<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Price Checker</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f5f5f7;
            color: #1d1d1f;
        }

        .container {
            text-align: center;
            background-color: #ffffff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            width: 350px;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        input {
            padding: 0.8rem;
            font-size: 1rem;
            border: 1px solid #d1d1d6;
            border-radius: 8px;
            width: calc(100% - 1.6rem);
            outline: none;
            margin-bottom: 1rem;
        }

        input:focus {
            border-color: #007aff;
            box-shadow: 0 0 4px rgba(0, 122, 255, 0.5);
        }

        button {
            background-color: #007aff;
            color: #ffffff;
            border: none;
            padding: 0.8rem;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            width: 100%;
        }

        button:hover {
            background-color: #005bb5;
        }

        p#price {
            font-size: 1.2rem;
            font-weight: 500;
            margin-top: 1.5rem;
        }

        .history {
            text-align: left;
            margin-top: 1.5rem;
        }

        .history h2 {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .history ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .history li {
            padding: 0.5rem 0;
            border-bottom: 1px solid #d1d1d6;
            cursor: pointer;
            color: #007aff;
            transition: color 0.3s ease;
        }

        .history li:last-child {
            border-bottom: none;
        }

        .history li:hover {
            color: #005bb5;
        }
    </style>
    <script>
        const history = [];

        async function getStockPrice(symbolInput = null) {
            const symbolField = document.getElementById("symbol");
            const symbol = symbolInput || symbolField.value.trim();
            if (!symbol) {
                alert("Please enter a stock symbol.");
                return;
            }
            symbolField.value = symbol; // Set input value when selecting history

            try {
                // Use Alpha Vantage free stock API
                const apiKey = "EGSBV3A51A84YIFW"; // Replace with your Alpha Vantage API key
                const apiUrl = `https://www.alphavantage.co/query?function=GLOBAL_QUOTE&symbol=${encodeURIComponent(symbol)}&apikey=${apiKey}`;

                const response = await fetch(apiUrl);
                if (!response.ok) {
                    throw new Error("Stock not found or invalid request.");
                }
                
                const data = await response.json();
                if (!data || !data["Global Quote"] || !data["Global Quote"]["05. price"]) {
                    throw new Error("No data available for the provided symbol.");
                }
                const stockPrice = parseFloat(data["Global Quote"]["05. price"]);
                
                document.getElementById("price").innerText = `The current price of ${symbol} is $${stockPrice.toFixed(2)}`;
                updateHistory(symbol);
            } catch (error) {
                console.error("Error fetching stock price:", error);
                document.getElementById("price").innerText = "Error fetching stock price. Please check the symbol and try again.";
            }
        }

        function updateHistory(symbol) {
            if (history.includes(symbol)) return;
            history.unshift(symbol);
            if (history.length > 5) history.pop();

            const historyList = document.getElementById("historyList");
            historyList.innerHTML = history.map(item => `<li onclick="getStockPrice('${item}')">${item}</li>`).join("");
        }

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("symbol").addEventListener("keydown", (e) => {
                if (e.key === "Enter") getStockPrice();
            });
        });
    </script>
</head>
<body>
    <div class="container">
        <h1>Stock Price Checker</h1>
        <input type="text" id="symbol" placeholder="Enter stock symbol">
        <button onclick="getStockPrice()">Get Stock Price</button>
        <p id="price"></p>

        <div class="history">
            <h2>Recent Queries</h2>
            <ul id="historyList"></ul>
        </div>
    </div>
</body>
</html>
